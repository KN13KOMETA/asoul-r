name: Validate Contributor Pull Request

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  pull-requests: write
  contents: read

jobs:
  check-pr-files:
    runs-on: ubuntu-latest
    steps:
      - name: Check for non-translation files
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;

            if (['OWNER', 'MEMBER'].includes(pr.author_association)) {
              console.log('PR created by repo owner/member. Skipping auto-close validation.');
              return;
            }

            const { data: files } = await github.rest.pulls.listFiles({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
            });

            const invalidFiles = files.filter(file => !file.filename.startsWith('messages/'));

            if (invalidFiles.length > 0) {
              const fileList = invalidFiles.map(f => `\`${f.filename}\``).join(', ');

              const message = `Thank you for your Pull Request!\n\n` +
                `However, as stated in our \`CONTRIBUTING.md\`, **only translation files in the \`messages/\` directory are currently accepted**.\n\n` +
                `This PR includes modifications to non-translation files (${fileList}) and has been automatically closed.`;

              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                body: message,
              });

              await github.rest.pulls.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pr.number,
                state: 'closed',
              });

              core.setFailed('PR contains non-translation files and was automatically closed.');
            }
