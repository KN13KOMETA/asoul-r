name: Run all checks

on:
  push:
    branches: [dev]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-commits:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v23

      - name: Setup pnpm and node
        uses: pnpm/setup@v3
        with:
          cache: true
          install: true
          require-lockfile: true

      - name: Run checks
        run: >
          nix develop -c bash
          -c "
          pnpm build:paraglide
          &&
          pnpm check
          "
